<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="centered accountPage">

    <div class="navbar">
        <h2 id="betterbox">BetterBox</h2>
        <div class="nav-links">
            <a class="link" href="index.html">Home</a>
        </div>
    </div>

    <div class="loginContainer" id="pageTitle">
        <h2>Create an Account</h2>

        <label for="username">Username:</label>
        <input name="username" id="username">

        <label for="password">Password:</label>
        <input type="password" name="password" id="password">

        <button id="createAccount">Create Account</button>

        <p>Already have an account? <button id="login">Login</button></p>
    </div>

<script src="database.js"></script>
<script>
document.getElementById("createAccount").addEventListener("click", async () => {
    // Get input values
    const usernameInput = document.getElementById("username").value.trim();
    const passwordInput = document.getElementById("password").value.trim();

    if (!usernameInput || !passwordInput) {
        alert("Please enter both username and password");
        return;
    }

    try {
        //get database
        const db = await getJSONData();

        const exists = db.users.some(u => u.username === usernameInput);
        if (exists) {
            alert("Username already exists.");
            return;
        }

        // Add new user
        const newUser = {
            username: usernameInput,
            password: passwordInput,
            createdAt: new Date().toISOString(),
            reviews: []
        };
        db.users.push(newUser);

        await putJSONData(db);

        alert("Account Created");
        window.location.href = "login.html";

    } catch (err) {
        console.error(err);
        alert("Error creating account");
    }
});

document.getElementById("login").addEventListener("click", async() =>{
        window.location.href = "login.html";
    });
</script>

    
</body>
</html>
