<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterBox</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

</head>
<body class="home">

    <!--Title-->
    <h2 id="betterbox">BetterBox</h2>

    <div class="navbar">
        <div class="nav-links">
            <a class="link" id="login" href="login.html">Login</a>
            <a class="link" id="createAccount" href="create-account.html">Create Account</a>
            <a class="link" id="userPage" href="user-page.html">My Profile</a>
        </div>
    </div>

    <!--Search Bar-->
    <section id="search-section">
        <div class="container">
            <label for="search"></label>
            <input type="text" id="search" name="search" placeholder="Enter a Movie Title...">
            <button id="submit">Search</button>
        </div>

    <!--Display results-->
        <div id="display"></div>
    </section>

    <script>
        //ApiKey and image path 
        const apiKey = '7217067691adb89a3555d60856d65290';
        const imageBaseUrl = 'https://image.tmdb.org/t/p/w500';
        //Display in html
        const display = document.getElementById("display");
        /*
        * Search function, gets the search value from the search bar, searches through array and
        * displays all movies with the value in the title 
        */
        function search(){
            
            //Get the input from the search bar
            const input = document.getElementById("search").value.toLowerCase().trim();
            //initialize display
            display.textContent = "";

            //If the input is empty
            if(!input){
                display.textContent = "Please Search a Movie";
                return;
            }

            //This takes in the apiKey and the input and places them into url for searching
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(input)}&include_adult=false&language=en-US`;

            //fetch the data from the database
            fetch(url)
            .then(response => response.json())
            .then(data => {
                //array of movies found
                const results = data.results;

                //if the array length is greater then zero show the title, date, and poster for each
                if(results.length > 0){
                    results.forEach(movie => {
                        const title = movie.title;
                        const year = movie.release_date ? movie.release_date : "N/A";
                        const id = movie.id;

                        // create card container
                        const div = document.createElement("div");
                        div.classList.add("movie-card");

                        // poster image
                        const poster = document.createElement("img");
                        poster.src = `${imageBaseUrl}${movie.poster_path}`;
                        poster.alt = `${title} poster`;

                        // click to go to movie page
                        div.addEventListener('click', () => {
                            window.location.href = `movie.html?id=${id}`;
                        });

                        // text info
                        const info = document.createElement("div");
                        info.classList.add("movie-text");
                        info.textContent = `${title} (${year})`;

                        // build structure
                        div.appendChild(poster);
                        div.appendChild(info);
                        display.appendChild(div);
                    })
                }else{
                    display.textContent = "No movie found";
                }
            })
            .catch(err => {
                display.textContent = "Error fetching data";
                console.error(err);
            });
        }

        //connect the submit button to the search function
        document.getElementById("submit").addEventListener("click", search);

        //if user is logged in hide login and create account, if not then hide userpage
        const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
        if(!loggedInUser){
            document.getElementById("userPage").style.display = "none";
        }else{
            document.getElementById("login").style.display = "none";
            document.getElementById("createAccount").style.display = "none";
        }
    </script>
</body>
</html>
