<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

</head>
<body class="centered accountPage">

    <div class="navbar">
        <h2 id="betterbox">BetterBox</h2>
        <div class="nav-links">
            <a class="link" href="index.html">Back to Home</a>
        </div>
    </div>

    <div class ="loginContainer" id="pageTitle">
        <h2>Login</h2>

        <label for="username">Username:</label>
        <input name="username" id="username">

        <label for="password">Password:</label>
        <input type="password" name="password" id="password">

        <button id="login">Login</button>

        <p>Don't have an account? <button id="createAccount">Create one</button></p>
    </div>

    <script src="database.js"></script>
    <script>

    document.getElementById("login").addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if(!username || !password){
            alert("Please enter username and password");
            return;
        }

        try{
            //get database
            const db = await getJSONData();
            const users = db.users;

            const user = users.find(u=>u.username === username && u.password === password);

            if(user){
                alert("Login successful!");
                localStorage.setItem("loggedInUser", JSON.stringify(user));
                window.location.href="user-page.html";
            }else{
                alert("Invalid username or password");
            }
        }catch(err){
            console.error(err);
            alert("Error logging in");
        }
    });


    document.getElementById("createAccount").addEventListener("click", async() =>{
        window.location.href = "create-account.html";
    });

    </script>
    
</body>
</html>
