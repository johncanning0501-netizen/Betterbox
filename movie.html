<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterBox</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

    <script src="https://use.fontawesome.com/aa97a80a47.js"></script>

</head>
<body class="layout">

    <div class="navbar">
        <h2 id="betterbox">BetterBox</h2>
        <div class="nav-links">
            <a class="link" href="index.html">Home</a>
        </div>
    </div>

     <div class="leftSide">
        <div id="movieContainer">
            <div id ="movieLeft"></div>
            <div id="movieRight"></div>
        </div>

        <h3>Rating: <span id="averageRating">No ratings available</span></h3>

        <button id="leaveReview">Leave a Review</button>

        <!-- Review Box (hidden by default) -->
        <div id="reviewModal" class= "modal">
            <div class="modalContent">
                <span class="close">&times;</span>
                <div id ="starContainer">
                    <p><i class="fa fa-star" style="color: gold;"></i> Rating:</p>
                    <span id="star1" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(1)"></span>
                    <span id="star2" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(2)"></span>
                    <span id="star3" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(3)"></span>
                    <span id="star4" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(4)"></span>
                    <span id="star5" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(5)"></span>
                    <span id="star6" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(6)"></span>
                    <span id="star7" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(7)"></span>
                    <span id="star8" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(8)"></span>
                    <span id="star9" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(9)"></span>
                    <span id="star10" class="fa fa-star" style="color:red; cursor:pointer;" onclick="starRating(10)"></span>
                </div>

                <textarea id="reviewText" rows="5" placeholder="Enter your review..."></textarea>
                <button id="submitReview">Submit</button>
            </div>
        </div>
        </div>

        <div class="rightSide">
            <!-- All Reviews -->
            <div id="reviews">
               <h4>Reviews:</h4>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const apiKey = '7217067691adb89a3555d60856d65290';
    const imageBaseUrl = 'https://image.tmdb.org/t/p/w500';
    const display = document.getElementById("display");
    const movieContainer = document.getElementById("movieContainer");
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
    let movieTitle = "";
    const averageRating = document.getElementById("averageRating");
    let rating = 0;
    const modal = document.getElementById("reviewModal");
    const closeBtn = document.querySelector(".close");
    

    function cleanup(){
        for(var i = 1; i <=10; i++){
            const star = document.getElementById('star' +i);
            if(star) star.style.color = "gray";
        }
    }

    function starRating(star){
        cleanup();
        rating = star;
        for(var i = 1; i<=star; i++){
            const starElement = document.getElementById('star' + i);
            if(starElement) starElement.style.color = "gold";
        }
    }

    function showRating(star){
        cleanup();
        for(var i = 1; i < star; i++){
            const starElement = document.getElementById('star' + i);
            if(starElement) starElement.style.color = "gold";
        }
    }

    function displayReviews(movie){
        const allReviews = document.getElementById("reviews");
        allReviews.innerHTML = '<h4>Reviews: </h4>';

        movie.reviews.forEach(review => {
            const reviewDiv = document.createElement("div");
            reviewDiv.classList.add("reviews");

            const usernameLink = document.createElement("a");
            usernameLink.textContent = review.username;
            usernameLink.style.cursor = "pointer";
            usernameLink.style.color = "white";
            usernameLink.classList.add("link", "no-margin");

            const reviewText = document.createElement("p");
            reviewText.innerHTML = `Rating: ${review.rating} <i class="fa fa-star" style="color: gold;"></i> - ${review.reviewText}`;

            reviewDiv.appendChild(usernameLink);
            reviewDiv.appendChild(document.createElement("br"));
            reviewDiv.appendChild(reviewText);
            
            if(loggedInUser && review.username === loggedInUser.username){
                usernameLink.href = `user-page.html`;
                
                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete Review";
                deleteButton.classList.add("deleteButton");
                deleteButton.addEventListener("click", async function () {
                    await deleteReview(movie.id, loggedInUser.username);

                    const db = await getJSONData();
                    const updatedMovie = db.movies.find(m => m.id == movieId);

                    movie.reviews = movie.reviews.filter(r => r.username === loggedInUser.username);
                    displayReviews(movie);

                    const updatedRatings = movie.reviews.map(r => r.rating);
                    updateAverageRating(updatedRatings);
                });

                reviewDiv.appendChild(deleteButton);
                
            }else{
                usernameLink.href = `user-page.html?username=${encodeURIComponent(review.username)}`;
            }
            allReviews.appendChild(reviewDiv);

        });
    }

    function updateAverageRating(ratings){
        var sum = 0;
            for(var i =0; i<ratings.length; i++){
                sum += ratings[i];
            }
            if(ratings.length >0){
                var avg = sum/ratings.length;
                averageRating.innerHTML = `${avg.toFixed(1)}/10 <i class="fa fa-star" style="color: gold;"></i>`;
            }else{
                averageRating.textContent = "No ratings available";
            }
    }
   
    async function review() {
        //get the database
        const db = await getJSONData();

        // Find or create movie in database
        let movie = db.movies.find(m => m.id == movieId);
        if (!movie) {
            movie = { 
                id: movieId, 
                reviews: [] 
            };
                db.movies.push(movie);
        }

        // Find logged in user in DB
        let user = null;
        if (loggedInUser) {
            user = db.users.find(u => u.username === loggedInUser.username);
        }

        // Load existing ratings
        let ratings = movie.reviews.map(r => r.rating);

        displayReviews(movie);
        updateAverageRating(ratings);

        // Display TMDB info
        if (!movieId) {
            display.textContent = 'No movie id provided in URL';
        } else {
            const url = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${apiKey}&include_adult=false&language=en-US`;
            fetch(url)
                .then(response => response.json())
                .then(data => {

                    movieTitle = data.title;
                    const year = data.release_date;
                    const description = data.overview;
                    const poster = document.createElement("img");
                    poster.classList.add("poster");
                    poster.src = `${imageBaseUrl}${data.poster_path}`;
                    poster.alt = `${movieTitle} poster`;

                    const backdropURL = data.backdrop_path 
                        ? `https://image.tmdb.org/t/p/original${data.backdrop_path}` 
                        : `${imageBaseUrl}${data.poster_path}`;

                    const layout = document.querySelector(".layout");
                    layout.style.background = `url('${backdropURL}') center center / cover no-repeat`;
                    layout.style.position = "relative";

                    movie

                    // fill left column
                    const left = document.getElementById("movieLeft");
                    left.innerHTML = "";
                    left.appendChild(poster);

                    // fill right column
                    const right = document.getElementById("movieRight");
                    right.innerHTML = "";

                    const titleEl = document.createElement("div");
                    titleEl.classList.add("title");
                    titleEl.textContent = data.title;

                    const yearEl = document.createElement("div");
                    yearEl.classList.add("year");
                    yearEl.textContent = data.release_date;

                    const summaryEl = document.createElement("div");
                    summaryEl.classList.add("summary");
                    summaryEl.textContent = data.overview;

                    right.appendChild(titleEl);
                    right.appendChild(yearEl);
                    right.appendChild(summaryEl);
                });
        }

        // Hide leave review if not logged in
        if (!loggedInUser){
            document.getElementById("leaveReview").style.display = "none";
        };
        
        //modal button
        closeBtn.onclick = function(){
            modal.style.display = "none";
        }

        window.onclick = function(event){
            if(event.target === modal){
                modal.style.display = "none";
            }
        }

        // Show review box if user hasn't reviewed yet
        document.getElementById("leaveReview").addEventListener("click", function() {
            if (movie.reviews.find(r => r.username === loggedInUser.username)) {
                alert("You have already left a review for this movie");
                return;
            }
            modal.style.display ="block";
        });

        // Submit review
        document.getElementById("submitReview").addEventListener("click", async function() {
            const reviewText = document.getElementById("reviewText").value.trim();
            const ratingValue = rating;
            

            if (!reviewText || ratingValue < 1 || ratingValue > 10) {
                alert("Please enter a rating between 1-10 and write a review");
                return;
            }

            // Add review to movie
            movie.reviews.push({ 
                username: loggedInUser.username, 
                rating: ratingValue, 
                reviewText: reviewText 
            });

            // Add review to user
            user.reviews.push({ 
                movieId: movieId, 
                title: movieTitle,
                rating: ratingValue, 
                reviewText: reviewText
            });

            //update ratings 
            ratings.push(rating);
            updateAverageRating(ratings);

            //display reviews
            displayReviews(movie);

            // Reset form
            modal.style.display = "none";
            document.getElementById("reviewText").value = "";
            rating = 0;
            cleanup();

            // Save to DB
            try{
                await putJSONData(db);
                alert("Review saved!");
            }catch(err){
                console.error("Failed to save review:", err);
                alert("failed");
            }
        });
    }
    review();

    async function deleteReview(movieId, username){
        try{
            const db = await getJSONData();
            const user = db.users.find(u => u.username === username);

            if(!user){
                console.error("user not found");
                return;
            } else {
                user.reviews = user.reviews.filter(r => r.movieId !== movieId);
            }

            const movie = db.movies.find(m => m.id == movieId);
            if(!movie) {
                console.error("Movie not found in database.");
            } else{
                movie.reviews = movie.reviews.filter(r => r.username !== username);
            }
            await putJSONData(db);
            window.location.reload();

        } catch(error){
            console.error(error);
        }
    } 
    </script>
</body>
</html>
